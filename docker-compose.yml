services:
  postgres:
    image: postgres:16-alpine
    container_name: mascotas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mascotas}
      POSTGRES_USER: ${DB_USER:-mascotas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mascotas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mascotas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: mascotas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mascotas}
      DB_USER: ${DB_USER:-mascotas}
      DB_PASSWORD: ${DB_PASSWORD:-mascotas}
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-produccion-por-uno-largo-y-random}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: mascotas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
