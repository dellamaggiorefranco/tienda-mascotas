spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mascotas}
    username: ${DB_USER:mascotas}
    password: ${DB_PASSWORD:mascotas}

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-en-produccion-por-uno-largo-y-random}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

springdoc:
  swagger-ui:
    path: /docs
